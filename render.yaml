services:
  - type: web
    name: switchqr-backend
    runtime: node
    plan: free
    region: oregon
    rootDirectory: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
